<h1>Вхід адміністратора</h1>

<form [formGroup]="form" (ngSubmit)="submit()">
  <label>Email <input type="email" formControlName="email" autocomplete="username" /></label>
  <label
    >Пароль <input type="password" formControlName="password" autocomplete="current-password"
  /></label>

  @if (error()) {
    <p role="alert">{{ error() }}</p>
  }

  <button [disabled]="form.invalid || loading()">Увійти</button>
</form>

<p><a routerLink="/feedback">Залишити відгук</a></p>
