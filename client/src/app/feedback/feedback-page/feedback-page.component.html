<h1>Залишити відгук</h1>

@if (submitted()) {
  <p class="success" role="status">Дякуємо, ваш відгук надіслано.</p>
}

<form [formGroup]="form" (ngSubmit)="submit()">
  <label>
    Ім’я
    <input formControlName="authorName" autocomplete="name" />
  </label>
  <label>
    Email
    <input type="email" formControlName="email" autocomplete="email" />
  </label>
  <label>
    Відгук
    <textarea formControlName="text" rows="6"></textarea>
  </label>

  @if (error()) {
    <p role="alert">{{ error() }}</p>
  }

  <button type="submit" [disabled]="form.invalid || saving()">
    {{ saving() ? 'Надсилання…' : 'Надіслати' }}
  </button>
</form>
